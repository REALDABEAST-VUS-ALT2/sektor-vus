<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sektor launcher</title>
    <style>
        body{margin:24px;background:#101814;color:#edf7f2;font:14px system-ui,sans-serif}
        button{display:inline-block;padding:10px 14px;border:1px solid #65e6ad;border-radius:7px;background:#17241e;color:#edf7f2;cursor:pointer}
        #status{color:#91b2a8}
    </style>
</head>
<body>
    <button id="open-sektor" type="button">Open Sektor</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script>
        const openButton = document.getElementById('open-sektor');
        const status = document.getElementById('status');
        const appUrl = new URL('https://sektor-b5021.web.app/VUS-Servers.html');

        openButton.addEventListener('click', () => {
            const popup = window.open('about:blank', '_blank');
            if (!popup) {
                status.textContent = 'Allow popups, or use “Open Sektor directly”.';
                return;
            }
            const freshAppUrl = new URL(appUrl);
            freshAppUrl.searchParams.set('launcher-refresh', Date.now().toString());
            popup.document.open();
            popup.document.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sektor</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}</style></head><body><iframe id="sektor-app" src="' + freshAppUrl.href + '" title="Sektor" allow="microphone https://sektor-b5021.web.app; camera https://sektor-b5021.web.app; autoplay https://sektor-b5021.web.app; display-capture https://sektor-b5021.web.app"></iframe></body></html>');
            popup.document.close();
            const frame = popup.document.getElementById('sektor-app');
            const appOrigin = appUrl.origin;
            let pendingDownloadUrl = '';
            popup.addEventListener('message', event => {
                const request = event.data;
                if (event.origin !== appOrigin || event.source !== frame.contentWindow ||
                    !request || request.type !== 'sektor-nexus-download' ||
                    typeof request.requestId !== 'string' || !request.blob ||
                    typeof request.blob.size !== 'number' || typeof request.blob.type !== 'string' ||
                    typeof request.blob.slice !== 'function') return;
                let downloadUrl;
                try {
                    const filename = String(request.filename || 'nexus-export')
                        .replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')
                        .replace(/[. ]+$/g, '')
                        .trim()
                        .slice(0, 100) || 'nexus-export';
                    const previousDownload = popup.document.getElementById('nexus-download-link');
                    if (previousDownload) previousDownload.remove();
                    if (pendingDownloadUrl) popup.URL.revokeObjectURL(pendingDownloadUrl);
                    downloadUrl = popup.URL.createObjectURL(request.blob);
                    pendingDownloadUrl = downloadUrl;
                    const link = popup.document.createElement('a');
                    link.id = 'nexus-download-link';
                    link.href = downloadUrl;
                    link.download = filename;
                    link.textContent = 'Download ' + filename;
                    link.setAttribute('role', 'button');
                    link.style.cssText = 'position:fixed;z-index:2147483647;top:12px;right:12px;max-width:calc(100vw - 24px);overflow:hidden;padding:12px 16px;border:1px solid #a5f06d;border-radius:9px;background:#a5f06d;color:#182012;font:700 14px system-ui,sans-serif;text-decoration:none;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 4px 18px #0008';
                    link.addEventListener('click', () => {
                        link.remove();
                        pendingDownloadUrl = '';
                        popup.setTimeout(() => popup.URL.revokeObjectURL(downloadUrl), 60000);
                    }, {once:true});
                    popup.document.body.appendChild(link);
                    event.source.postMessage({
                        type: 'sektor-nexus-download-result',
                        requestId: request.requestId,
                        ok: true
                    }, event.origin);
                } catch (error) {
                    if (downloadUrl) popup.URL.revokeObjectURL(downloadUrl);
                    pendingDownloadUrl = '';
                    event.source.postMessage({
                        type: 'sektor-nexus-download-result',
                        requestId: request.requestId,
                        ok: false
                    }, event.origin);
                    status.textContent = 'Nexus could not export that file. Check the browser download settings.';
                }
            });
            status.textContent = 'Sektor opened.';
        });
    </script>
</body>
</html>
