<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sektor launcher</title>
    <style>
        body{margin:24px;background:#101814;color:#edf7f2;font:14px system-ui,sans-serif}
        button{display:inline-block;padding:10px 14px;border:1px solid #65e6ad;border-radius:7px;background:#17241e;color:#edf7f2;cursor:pointer}
        #status{color:#91b2a8}
    </style>
</head>
<body>
    <button id="open-sektor" type="button">Open Sektor</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script>
        const openButton = document.getElementById('open-sektor');
        const status = document.getElementById('status');
        const repoUrl = new URL('https://raw.githubusercontent.com/sektorfixer-code/sektor-vus/main/');
        const appUrl = new URL('VUS-Servers.html', repoUrl);

        openButton.addEventListener('click', () => {
            const popup = window.open('about:blank', '_blank');
            if (!popup) {
                status.textContent = 'Allow popups, or use “Open Sektor directly”.';
                return;
            }
            popup.document.open();
            popup.document.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sektor</title><style>html,body,iframe{width:100%;height:100vh;height:100dvh;margin:0;border:0;overflow:hidden}#raw-loader-status{position:fixed;z-index:2;top:12px;left:12px;padding:9px 12px;border:1px solid #65e6ad;border-radius:7px;background:#17241e;color:#edf7f2;font:13px system-ui,sans-serif}</style></head><body><iframe id="sektor-app" title="Sektor" referrerpolicy="no-referrer" allow="microphone; camera; autoplay; display-capture"></iframe><div id="raw-loader-status" role="status">Loading Sektor source…</div></body></html>');
            popup.document.close();
            const frame = popup.document.getElementById('sektor-app');
            const loaderStatus = popup.document.getElementById('raw-loader-status');
            const appOrigin = popup.location.origin;
            let pendingDownloadUrl = '';
            let activeScriptUrls = [];
            let pageLoadVersion = 0;
            const isRepoFile = url => url.origin === repoUrl.origin && url.pathname.startsWith(repoUrl.pathname);
            const loadRawPage = async pageUrl => {
                const version = ++pageLoadVersion;
                const url = new URL(pageUrl);
                if (!isRepoFile(url)) throw new Error('The requested page is outside the Sektor repository.');
                const response = await fetch(url.href, {cache:'no-store', referrerPolicy:'no-referrer'});
                if (!response.ok || !isRepoFile(new URL(response.url))) throw new Error('Could not load the Sektor source from GitHub.');
                const sourceDocument = new DOMParser().parseFromString(await response.text(), 'text/html');
                const base = sourceDocument.createElement('base');
                base.href = new URL('.', url).href;
                sourceDocument.head.prepend(base);
                if (url.search || url.hash) {
                    const routeState = sourceDocument.createElement('script');
                    routeState.textContent = 'if(location.origin!=="null")history.replaceState(null,"",location.origin+"/"+' + JSON.stringify(url.search + url.hash) + ');';
                    base.after(routeState);
                }
                for (const link of [...sourceDocument.querySelectorAll('link[rel~="stylesheet"][href]')]) {
                    const assetUrl = new URL(link.getAttribute('href'), url);
                    if (!isRepoFile(assetUrl)) continue;
                    const assetResponse = await fetch(assetUrl.href, {cache:'no-store', referrerPolicy:'no-referrer'});
                    if (!assetResponse.ok) throw new Error('Could not load a Sektor stylesheet from GitHub.');
                    const style = sourceDocument.createElement('style');
                    style.textContent = await assetResponse.text();
                    link.replaceWith(style);
                }
                const scriptUrls = [];
                for (const script of [...sourceDocument.querySelectorAll('script[src]')]) {
                    const assetUrl = new URL(script.getAttribute('src'), url);
                    if (!isRepoFile(assetUrl)) continue;
                    const assetResponse = await fetch(assetUrl.href, {cache:'no-store', referrerPolicy:'no-referrer'});
                    if (!assetResponse.ok) throw new Error('Could not load a Sektor script from GitHub.');
                    const scriptUrl = popup.URL.createObjectURL(new popup.Blob([await assetResponse.text()], {type:'text/javascript'}));
                    script.removeAttribute('integrity');
                    script.src = scriptUrl;
                    scriptUrls.push(scriptUrl);
                }
                sourceDocument.querySelectorAll('script:not([src])').forEach(script => {
                    script.textContent = script.textContent.replace(/new URL\((['"])(\.\/[^'"]+)\1,\s*window\.location\.href\)/g,
                        (match, quote, path) => 'new URL(' + quote + path + quote + ', document.baseURI)');
                });
                const router = sourceDocument.createElement('script');
                router.textContent = 'document.addEventListener("click",event=>{const link=event.target.closest("a[href]");if(!link||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||link.hasAttribute("download"))return;const target=new URL(link.href);if(target.origin!=="' + repoUrl.origin + '"||!target.pathname.startsWith("' + repoUrl.pathname + '"))return;event.preventDefault();parent.postMessage({type:"sektor-raw-navigation",url:target.href},"*");});';
                sourceDocument.body.appendChild(router);
                if (version !== pageLoadVersion) {
                    scriptUrls.forEach(scriptUrl => popup.URL.revokeObjectURL(scriptUrl));
                    return;
                }
                const previousScriptUrls = activeScriptUrls;
                activeScriptUrls = scriptUrls;
                frame.addEventListener('load', () => previousScriptUrls.forEach(scriptUrl => popup.URL.revokeObjectURL(scriptUrl)), {once:true});
                frame.srcdoc = '<!doctype html>' + sourceDocument.documentElement.outerHTML;
                loaderStatus.hidden = true;
            };
            popup.addEventListener('message', event => {
                const request = event.data;
                if ((event.origin !== appOrigin && event.origin !== 'null') || event.source !== frame.contentWindow || !request) return;
                if (request.type === 'sektor-raw-navigation') {
                    try {
                        const nextPage = new URL(request.url);
                        if (!isRepoFile(nextPage)) return;
                        loadRawPage(nextPage.href).catch(() => {
                            loaderStatus.textContent = 'Could not load that Sektor page from GitHub.';
                            loaderStatus.hidden = false;
                        });
                    } catch (error) {
                        loaderStatus.textContent = 'Could not load that Sektor page from GitHub.';
                        loaderStatus.hidden = false;
                    }
                    return;
                }
                if (request.type !== 'sektor-nexus-download' ||
                    typeof request.requestId !== 'string' || !request.blob ||
                    typeof request.blob.size !== 'number' || typeof request.blob.type !== 'string' ||
                    typeof request.blob.slice !== 'function') return;
                let downloadUrl;
                try {
                    const filename = String(request.filename || 'nexus-export')
                        .replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')
                        .replace(/[. ]+$/g, '')
                        .trim()
                        .slice(0, 100) || 'nexus-export';
                    const previousDownload = popup.document.getElementById('nexus-download-link');
                    if (previousDownload) previousDownload.remove();
                    if (pendingDownloadUrl) popup.URL.revokeObjectURL(pendingDownloadUrl);
                    downloadUrl = popup.URL.createObjectURL(request.blob);
                    pendingDownloadUrl = downloadUrl;
                    const link = popup.document.createElement('a');
                    link.id = 'nexus-download-link';
                    link.href = downloadUrl;
                    link.download = filename;
                    link.textContent = 'Download ' + filename;
                    link.setAttribute('role', 'button');
                    link.style.cssText = 'position:fixed;z-index:2147483647;top:12px;right:12px;max-width:calc(100vw - 24px);overflow:hidden;padding:12px 16px;border:1px solid #a5f06d;border-radius:9px;background:#a5f06d;color:#182012;font:700 14px system-ui,sans-serif;text-decoration:none;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 4px 18px #0008';
                    link.addEventListener('click', () => {
                        link.remove();
                        pendingDownloadUrl = '';
                        popup.setTimeout(() => popup.URL.revokeObjectURL(downloadUrl), 60000);
                    }, {once:true});
                    popup.document.body.appendChild(link);
                    event.source.postMessage({
                        type: 'sektor-nexus-download-result',
                        requestId: request.requestId,
                        ok: true
                    }, '*');
                } catch (error) {
                    if (downloadUrl) popup.URL.revokeObjectURL(downloadUrl);
                    pendingDownloadUrl = '';
                    event.source.postMessage({
                        type: 'sektor-nexus-download-result',
                        requestId: request.requestId,
                        ok: false
                    }, '*');
                    status.textContent = 'Nexus could not export that file. Check the browser download settings.';
                }
            });
            loadRawPage(appUrl.href).then(() => { status.textContent = 'Sektor opened from GitHub source.'; }).catch(() => {
                loaderStatus.textContent = 'Could not load Sektor from raw GitHub content.';
                loaderStatus.hidden = false;
                status.textContent = 'Sektor could not be loaded.';
            });
        });
    </script>
</body>
</html>
