<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090f0d">
  <title>Inventory · Nexus · Sektor</title>
  <link rel="stylesheet" href="./nexus.css?v=20261009-19">
</head>
<body>
  <main class="nexus-app">
    <header class="nexus-header">
      <a class="nexus-back" href="./nexus.html" id="back-link">← Back to Nexus</a>
      <div class="nexus-brand"><span class="nexus-mark">N</span><div><strong>Nexus inventory</strong><small id="world-mode">Sektor social world</small></div></div>
      <button id="connect-button" class="nexus-primary" type="button">Connect to Nexus</button>
    </header>
    <p id="status" class="nexus-status" role="status" aria-live="polite">Open your inventory, then connect when you’re ready.</p>
    <section id="content" class="nexus-content" aria-live="polite">
      <div class="nexus-welcome"><span>SEKTOR · NEXUS INVENTORY</span><h1>Your items and creations.</h1><p>Connect to manage your Nexus inventory.</p></div>
    </section>
  </main>
  <script>
    const backUrl = new URL('./nexus.html', window.location.href);
    if (new URLSearchParams(window.location.search).get('lan') === '1') backUrl.searchParams.set('lan', '1');
    document.getElementById('back-link').href = backUrl.href;
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
